backend:
  name: turbo-github
  turbo_site_id: a5d18cb4-c968-4432-b0ab-5f917339519c
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: catalogo
    label: Catálogo
    files:
      - name: productos
        label: Productos
        file: data/products.json
        fields:
          - label: Productos
            name: products
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Nombre, name: name, widget: string }
              - { label: Categoría, name: category, widget: string }
              - { label: Precio, name: price, widget: number }
              - { label: Descripción, name: desc, widget: text }
              - { label: Imagen, name: image, widget: image, required: false }
              - { label: Mostrar en “Recién llegados”, name: featured, widget: boolean, default: false }
              - { label: Grupo de cantidad, name: groupId, widget: string, required: false }
              - { label: Cantidad del grupo, name: quantity, widget: number, required: false }
          - label: Extras de agenda
            name: agendaExtras
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Nombre, name: name, widget: string }
              - { label: Precio adicional, name: price, widget: number }
              - { label: Descripción, name: desc, widget: text }

      - name: celebraciones
        label: Celebraciones
        file: data/celebrations.json
        fields:
          - label: Celebraciones
            name: celebrations
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Nombre, name: name, widget: string }
              - { label: Activa, name: active, widget: boolean, default: false }
              - { label: Banner, name: banner, widget: image, required: false }
              - { label: Título, name: title, widget: string }
              - { label: Subtítulo, name: subtitle, widget: string }
              - { label: Texto del botón, name: button, widget: string }
              - label: Productos del catálogo
                name: products
                widget: list
                required: false
                field: { label: ID del producto, name: id, widget: string }

          - label: “Quizás te interese agregar…”
            name: upsells
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Nombre, name: name, widget: string }
              - { label: Precio, name: price, widget: number }
              - { label: Descripción, name: desc, widget: text }
              - { label: Ícono, name: icon, widget: string, required: false }

  - name: faq
    label: Preguntas frecuentes
    files:
      - name: preguntas
        label: Preguntas frecuentes
        file: data/faq.json
        fields:
          - label: Preguntas frecuentes
            name: faqs
            widget: list
            fields:
              - { label: Pregunta, name: question, widget: string }
              - { label: Respuesta, name: answer, widget: text }
              - { label: Activa, name: active, widget: boolean, default: true }

  - name: site
    label: Inicio y navegación
    files:
      - name: configuracion
        label: Inicio y navegación
        file: data/site.json
        fields:
          - label: Menú de navegación
            name: navigation
            widget: list
            fields:
              - { label: Nombre que se muestra, name: label, widget: string }
              - { label: Sección de destino, name: target, widget: string, hint: "Usa inicio, catalogo o banners." }
              - { label: Mostrar, name: active, widget: boolean, default: true }
          - label: Página de inicio
            name: homepage
            widget: object
            fields:
              - { label: Título de productos destacados, name: newArrivalsTitle, widget: string }
              - { label: Cantidad de productos destacados, name: newArrivalsLimit, widget: number, value_type: int, min: 1, max: 20 }
              - { label: Mostrar productos destacados, name: showNewArrivals, widget: boolean, default: true }
              - { label: Mostrar sección Celebraciones, name: showCelebrations, widget: boolean, default: true }
