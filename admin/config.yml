backend:
  name: turbo-github
  turbo_site_id: a5d18cb4-c968-4432-b0ab-5f917339519c
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: catalogo
    label: Catálogo
    files:
      - name: productos
        label: Productos
        file: data/products.json
        fields:
          - label: Productos
            name: products
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Nombre, name: name, widget: string }
              - { label: Categoría, name: category, widget: string }
              - { label: Precio, name: price, widget: number }
              - { label: Descripción, name: desc, widget: text }
              - { label: Imagen, name: image, widget: image, required: false }
              - { label: Mostrar en “Recién llegados”, name: featured, widget: boolean, default: false }
              - { label: Activar opciones de cantidad, name: hasQuantity, widget: boolean, default: false, hint: "Actívalo si este producto tendrá opciones como 50 hojas, 100 hojas, etc." }
              - label: Opciones de cantidad
                name: quantities
                widget: list
                required: false
                condition: { field: hasQuantity, value: true }
                hint: "Agrega las cantidades y sus precios. Ejemplo: 50 hojas / $4.000."
                fields:
                  - { label: Cantidad, name: label, widget: string, hint: "Ejemplo: 50 hojas" }
                  - { label: Precio, name: price, widget: number, value_type: int, min: 0 }
              - { label: Grupo de cantidad (compatibilidad), name: groupId, widget: string, required: false, hidden: true }
              - { label: Cantidad del grupo (compatibilidad), name: quantity, widget: number, required: false, hidden: true }
          - label: Extras de agenda
            name: agendaExtras
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Nombre, name: name, widget: string }
              - { label: Precio adicional, name: price, widget: number }
              - { label: Descripción, name: desc, widget: text }

      - name: celebraciones
        label: Celebraciones
        file: data/celebrations.json
        fields:
          - label: Celebraciones
            name: celebrations
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Nombre, name: name, widget: string }
              - { label: Activa, name: active, widget: boolean, default: false }
              - { label: Banner, name: banner, widget: image, required: false }
              - { label: Título, name: title, widget: string }
              - { label: Subtítulo, name: subtitle, widget: string }
              - { label: Texto del botón, name: button, widget: string }
              - label: Productos del catálogo
                name: products
                widget: list
                required: false
                field: { label: ID del producto, name: id, widget: string }

          - label: “Quizás te interese agregar…”
            name: upsells
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - { label: Nombre, name: name, widget: string }
              - { label: Precio, name: price, widget: number }
              - { label: Descripción, name: desc, widget: text }
              - { label: Ícono, name: icon, widget: string, required: false }

  - name: nuevos
    label: 🆕 Productos nuevos
    files:
      - name: portada
        label: Productos nuevos de portada
        file: data/home-new-products.json
        fields:
          - label: Productos nuevos
            name: products
            widget: list
            max: 8
            fields:
              - { label: Nombre del producto, name: title, widget: string }
              - { label: Imagen, name: image, widget: image, required: false }
              - { label: Precio, name: price, widget: number, required: false }
              - { label: Destino, name: target, widget: string, required: false, hint: "Opcional. Usa catalogo." }

  - name: faq
    label: Preguntas frecuentes
    files:
      - name: preguntas
        label: Preguntas frecuentes
        file: data/faq.json
        fields:
          - label: Preguntas frecuentes
            name: faqs
            widget: list
            fields:
              - { label: Pregunta, name: question, widget: string }
              - { label: Respuesta, name: answer, widget: text }
              - { label: Activa, name: active, widget: boolean, default: true }

  - name: site
    label: Inicio y navegación
    files:
      - name: configuracion
        label: Inicio y navegación
        file: data/site.json
        fields:
          - label: Menú de navegación
            name: navigation
            widget: list
            fields:
              - { label: Nombre que se muestra, name: label, widget: string }
              - { label: Sección de destino, name: target, widget: string, hint: "Usa inicio, catalogo o banners." }
              - { label: Mostrar, name: active, widget: boolean, default: true }

          - label: Página de inicio
            name: homepage
            widget: object
            fields:
              - { label: Título de productos destacados, name: newArrivalsTitle, widget: string }
              - { label: Cantidad de productos destacados, name: newArrivalsLimit, widget: number, value_type: int, min: 1, max: 20 }
              - { label: Mostrar productos destacados, name: showNewArrivals, widget: boolean, default: true }
              - label: Productos nuevos de la portada
                name: homeNewProducts
                widget: list
                max: 8
                required: false
                fields:
                  - { label: Nombre del producto, name: title, widget: string }
                  - { label: Imagen del producto, name: image, widget: image, required: false }
                  - { label: Precio, name: price, widget: number, required: false }
                  - { label: Destino, name: target, widget: string, required: false, hint: "Opcional. Usa catalogo para llevar al catálogo." }

              - label: Sección de categorías de portada
                name: categorySection
                widget: object
                fields:
                  - { label: Mostrar sección, name: active, widget: boolean, default: true }
                  - { label: Título, name: title, widget: string }
                  - { label: Subtítulo, name: subtitle, widget: text, required: false }
                  - label: Tarjetas de imágenes de la portada
                    name: items
                    widget: list
                    max: 4
                    fields:
                      - { label: Texto, name: title, widget: string }
                      - { label: Imagen, name: image, widget: image, required: false }
                      - { label: Destino, name: target, widget: string, hint: "Usa catalogo para llevar al catálogo." }

              - label: Portada principal
                name: hero
                widget: object
                fields:
                  - { label: Mostrar, name: active, widget: boolean, default: false }
                  - { label: Título, name: title, widget: string, required: false }
                  - { label: Subtítulo, name: subtitle, widget: text, required: false }
                  - { label: Texto del botón, name: button, widget: string, required: false }
                  - { label: Imagen, name: image, widget: image, required: false }

              - label: Promoción
                name: promo
                widget: object
                fields:
                  - { label: Mostrar, name: active, widget: boolean, default: false }
                  - { label: Título, name: title, widget: string, required: false }
                  - { label: Texto, name: text, widget: text, required: false }
                  - { label: Texto del botón, name: button, widget: string, required: false }
                  - { label: Imagen, name: image, widget: image, required: false }

              - label: Servicios
                name: services
                widget: list
                max: 4
                fields:
                  - { label: Ícono, name: icon, widget: string }
                  - { label: Título, name: title, widget: string }
                  - { label: Texto, name: text, widget: string }

              - { label: Texto de despacho, name: shippingText, widget: text, required: false }
              - { label: Texto de medios de pago, name: paymentText, widget: text, required: false }
              - { label: Texto de presentación, name: homepageText, widget: text, required: false }
              - { label: Mostrar sección Celebraciones, name: showCelebrations, widget: boolean, default: true }
